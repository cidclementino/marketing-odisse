<body class="vista-login">
  <!-- Menu geral: no futuro, outras páginas entram aqui -->
  <header class="topo">
    <a class="marca" href="#/">
      <span class="marca-selo" id="marcaSelo"></span>
      <span class="marca-nome">Universo</span>
      <span class="marca-sub">Odisse</span>
    </a>
    <nav class="menu" aria-label="Menu geral">
      <a class="ativo" href="#/" id="menuPosts">Posts 3:4</a>
      <span class="em-breve" title="Em breve">Stories 9:16</span>
      <span class="em-breve" title="Em breve">Calendário</span>
      <span class="em-breve" title="Em breve">Biblioteca</span>
      <span class="em-breve" title="Em breve">Estratégia</span>
      <a href="#/metricas" id="menuMetricas">Métricas</a>
    </nav>
    <div class="topo-acoes">
      <button class="sair" id="btSair" title="Sair deste computador">Sair</button>
    </div>
  </header>

  <!-- ===================== ENTRADA ===================== -->
  <main class="login" id="login">
    <form class="login-caixa" id="formLogin">
      <span class="login-selo" id="loginSelo"></span>
      <h1>Universo</h1>
      <p>Gestão de marketing e produção de mídias do Odisse.</p>
      <label class="campo"><span>Senha</span><input type="password" id="loginSenha" autocomplete="current-password" required></label>
      <p class="erro" id="loginErro" role="alert"></p>
      <button type="submit" id="btEntrar">Entrar</button>
    </form>
  </main>

  <!-- ===================== INÍCIO: criar + arquivo ===================== -->
  <main class="inicio" id="inicio">
    <section class="criar">
      <div class="sec-cab linha">
        <h1>Nova publicação <span class="info" tabindex="0" data-info="Escolha o núcleo. O carrossel já começa com o repertório de modelos dele.">i</span></h1>
        <a class="bt-padroes" href="#/padroes">Padrões de texto e espaçamento</a>
      </div>
      <div class="nucleo-tiles" id="tiles"></div>
    </section>

    <section class="arquivo">
      <div class="sec-cab linha">
        <div>
          <h2>Arquivo</h2>
          <p id="arquivoInfo"></p>
        </div>
        <div class="filtros">
          <div class="chips" id="filtros"></div>
          <input type="search" id="busca" placeholder="Buscar publicação" aria-label="Buscar publicação">
        </div>
      </div>
      <div class="lista-pubs" id="listaPubs"></div>
    </section>
  </main>

  <!-- ===================== PADRÕES ===================== -->
  <main class="padroes" id="padroes"></main>

  <!-- ===================== MÉTRICAS ===================== -->
  <main class="metricas" id="metricas"></main>

  <!-- ===================== EDITOR ===================== -->
  <div class="pub-barra" id="pubBarra">
    <a class="voltar" href="#/">← Publicações</a>
    <div class="pub-id">
      <span class="chip" id="pubChip"></span>
      <span class="pub-nucleo" id="pubNucleo"></span>
      <input id="pubTitulo" class="pub-titulo" type="text" placeholder="Título da publicação" aria-label="Título da publicação">
    </div>
    <div class="pub-salvar">
      <span class="sinc" id="sinc" data-estado="pronto"><span class="ponto"></span><span id="sincTxt"></span></span>
      <button id="btSalvar" title="Salvar na nuvem (Ctrl+S)">Salvar</button>
    </div>
  </div>

  <main class="editor" id="editor">
    <aside class="lado esq">
      <div class="lado-corpo" id="globais">
        <details class="macro" data-macro="publicacao" open>
          <summary><h2>Dados da publicação</h2></summary>
          <div class="macro-corpo" id="globaisPub"></div>
        </details>
        <details class="macro" data-macro="card" open>
          <summary><h2>Dados do card <span class="card-tag" id="cardTag"></span></h2></summary>
          <div class="macro-corpo">
            <div class="secao opcoes" id="opcoes" hidden></div>
            <div class="secao textos" id="textos" hidden></div>
            <div class="secao imagens" id="imagens"></div>
          </div>
        </details>
      </div>
    </aside>

    <section class="palco" id="palco">
      <div class="barra">
        <div class="barra-g">
          <span class="posicao" id="posicao"></span>
          <span class="modelo-atual" id="modeloAtual"></span>
        </div>
        <div class="acoes-card" id="acoesCard">
          <button class="txt" id="btDuplicar" title="Duplicar card">Duplicar</button>
          <button class="txt perigo" id="btExcluir" title="Excluir card">Excluir</button>
        </div>
        <div class="seg" role="group" aria-label="Visualização" id="modos">
          <button data-modo="3" title="Card ativo com os vizinhos">3</button>
          <button data-modo="todos" title="Todos em linha, como carrossel">Todos</button>
        </div>
      </div>
      <div class="trilho-wrap" id="trilhoWrap">
        <button class="nav-seta esq" id="navEsq" aria-label="Card anterior">‹</button>
        <div class="trilho" id="trilho"></div>
        <button class="nav-seta dir" id="navDir" aria-label="Próximo card">›</button>
      </div>
      <div class="rodape">
        <div class="seg guias-bt" role="group" aria-label="Guias de composição" id="guias"></div>
        <div class="paginacao">
          <button class="ico" id="btMoverEsq" title="Mover o card para a esquerda">←</button>
          <div class="pontos" id="pontos"></div>
          <button class="ico" id="btMoverDir" title="Mover o card para a direita">→</button>
        </div>
        <div class="exportar">
          <button class="txt" id="btExportarCard">Exportar card</button>
          <button class="txt forte" id="btExportarTudo">Exportar carrossel</button>
        </div>
      </div>
    </section>

    <aside class="lado dir">
      <div class="lado-cab">
        <h2>Modelos <span class="info" tabindex="0" data-info="Clique num modelo para aplicá-lo ao card selecionado.">i</span></h2>
      </div>
      <div class="lado-corpo">
        <div id="modelos"></div>
      </div>
    </aside>
  </main>

  <div id="exportador" aria-hidden="true"></div>
  <input type="file" id="arquivo" accept="image/*" hidden>
  <div class="aviso" id="aviso" role="status"></div>
  <div class="dica-flut" id="dicaFlut" role="tooltip"></div>

  <script src="vendor/html-to-image.js?v=ad74ac1e13"></script>
  <script src="vendor/jszip.min.js?v=978d62b574"></script>
  <script type="module" src="assets/js/app.js?v=ebd7bfd19a"></script>
</body>
</html>
