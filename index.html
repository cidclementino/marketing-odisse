<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Marketing — agora no Universo</title>
<script>
  // Desde 24/11/2026 o Marketing mora no Universo: universo.odisse.com.br/marketing/ (mesma senha da equipe).
  // O endereço antigo só redireciona, mantendo a rota (#/calendario, #/p/<publicação>…). O retorno do login do
  // Meta (#_=_) vai para as Métricas.
  var h = location.hash === '#_=_' ? '#/metricas' : location.hash;
  location.replace('https://universo.odisse.com.br/marketing/' + location.search + h);
</script>
</head>
<body><p>O Marketing agora fica no <a href="https://universo.odisse.com.br/marketing/">Universo</a>.</p></body>
</html>
