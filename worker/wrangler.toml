name = "universo-odisse"
main = "index.js"
compatibility_date = "2026-07-01"

# Namespace KV criado no painel da Cloudflare (Storage & Databases → KV → "UNIVERSO").
# Troque o id abaixo pelo id real do namespace.
kv_namespaces = [
  { binding = "UNIVERSO", id = "COLE_AQUI_O_ID_DO_NAMESPACE" },
]

# A senha (UNIVERSO_SENHA) é enviada pelo GitHub Actions a partir do secret
# do repositório — nunca coloque o valor aqui.
