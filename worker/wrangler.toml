name = "universo-odisse"
main = "index.js"
compatibility_date = "2026-07-01"

# Namespace KV criado no painel da Cloudflare (Storage & Databases → KV → "UNIVERSO").
# id do namespace UNIVERSO.
kv_namespaces = [
  { binding = "UNIVERSO", id = "c81536c0dfee4862ad17123ae6f835d4" },
]

# A senha (UNIVERSO_SENHA) é enviada pelo GitHub Actions a partir do secret
# do repositório — nunca coloque o valor aqui.

# Coleta diária das métricas do Instagram: 06:17 em Brasília (09:17 UTC).
[triggers]
crons = ["17 9 * * *"]
